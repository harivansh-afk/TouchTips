name: TouchTips
options:
  bundleIdPrefix: sh.harivan
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: configs/Local.xcconfig
  Release: configs/Local.xcconfig

packages:
  TouchTipsCore:
    path: Packages/TouchTipsCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  TouchTips:
    type: application
    platform: iOS
    sources:
      - path: Sources/TouchTips
    dependencies:
      - package: TouchTipsCore
    info:
      path: Sources/TouchTips/Info.plist
      properties:
        CFBundleDisplayName: touchtips
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location]
        UIAppFonts: [InstrumentSerif-Italic.ttf]
        ITSAppUsesNonExemptEncryption: false
        NSContactsUsageDescription: touchtips watches for new contacts so it can remember when you met them. It needs full access; limited access cannot see changes.
        NSLocationWhenInUseUsageDescription: touchtips uses your location to remember where you met people.
        NSLocationAlwaysAndWhenInUseUsageDescription: Always access lets touchtips notice a visit ending while it is closed, which is how a new contact gets a place.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.harivan.touchtips
        PRODUCT_NAME: touchtips
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
