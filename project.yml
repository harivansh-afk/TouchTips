name: TouchTips
options:
  bundleIdPrefix: sh.harivan
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: configs/Local.xcconfig
  Release: configs/Local.xcconfig

packages:
  TouchTipsCore:
    path: Packages/TouchTipsCore
  Lottie:
    url: https://github.com/airbnb/lottie-spm
    exactVersion: 4.5.2
  PhoneNumberKit:
    url: https://github.com/PhoneNumberKit/PhoneNumberKit
    exactVersion: 5.0.8

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  TouchTips:
    type: application
    platform: iOS
    sources:
      - path: Sources/TouchTips
    dependencies:
      - package: TouchTipsCore
      - package: Lottie
      - package: PhoneNumberKit
    info:
      path: Sources/TouchTips/Info.plist
      properties:
        CFBundleDisplayName: TouchTips
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, fetch]
        BGTaskSchedulerPermittedIdentifiers: [sh.harivan.touchtips.refresh]
        UIAppFonts: [InstrumentSerif-Italic.ttf]
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        NSContactsUsageDescription: Notices new contacts. Limited access cannot see changes.
        NSLocationWhenInUseUsageDescription: Remembers where you met people.
        NSLocationAlwaysAndWhenInUseUsageDescription: Uses background location to help discover new contacts and remember where you may have met.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.harivan.touchtips
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: TouchTips
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/TouchTips/TouchTips-Bridging-Header.h

  TouchTipsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/TouchTipsTests]
    dependencies:
      - target: TouchTips
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  TouchTipsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/TouchTipsUITests]
    dependencies:
      - target: TouchTips
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TouchTips:
    build:
      targets:
        TouchTips: all
    test:
      targets:
        - TouchTipsTests
        - TouchTipsUITests
      gatherCoverageData: true
