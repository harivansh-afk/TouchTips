name: TouchedTips
options:
  bundleIdPrefix: sh.harivan
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: configs/Local.xcconfig
  Release: configs/Local.xcconfig

packages:
  TouchedTipsCore:
    path: Packages/TouchedTipsCore
  Lottie:
    url: https://github.com/airbnb/lottie-spm
    exactVersion: 4.5.2
  PhoneNumberKit:
    url: https://github.com/PhoneNumberKit/PhoneNumberKit
    exactVersion: 5.0.8

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  TouchedTips:
    type: application
    platform: iOS
    sources:
      - path: Sources/TouchedTips
    dependencies:
      - package: TouchedTipsCore
      - package: Lottie
      - package: PhoneNumberKit
    info:
      path: Sources/TouchedTips/Info.plist
      properties:
        CFBundleDisplayName: TouchedTips
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location]
        UIAppFonts: [InstrumentSerif-Italic.ttf]
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        NSContactsUsageDescription: TouchedTips watches for new contacts so it can remember when you met them. It needs full access; limited access cannot see changes.
        NSLocationWhenInUseUsageDescription: TouchedTips uses your location to remember where you met people.
        NSLocationAlwaysAndWhenInUseUsageDescription: Always access lets TouchedTips notice a visit ending while it is closed, which is how a new contact gets a place.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.harivan.touchtips
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: TouchedTips
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/TouchedTips/TouchedTips-Bridging-Header.h
