name: Server

on:
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx wrangler d1 migrations apply touchtips --local
      - name: Smoke test against wrangler dev
        run: |
          npx wrangler dev > wrangler.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:8788/.well-known/apple-app-site-association && break
            sleep 1
          done
          npm run smoke
      - name: Dev server log
        if: failure()
        run: cat wrangler.log
