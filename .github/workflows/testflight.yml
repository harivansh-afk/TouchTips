# Every push to main becomes a TestFlight build.
#
# Runs on the GitHub mirror; Forgejo is the source of truth and pushes here.
# The build number is the run number, so each upload is higher than the last.
#
# Secrets (repository settings on GitHub):
#   APPLE_TEAM_ID       the ten-character team ID
#   ASC_KEY_ID          App Store Connect API key ID
#   ASC_ISSUER_ID       App Store Connect API issuer ID
#   ASC_API_KEY_P8      the .p8 file, base64
#   DEV_CERT_P12        Apple Development identity as .p12, base64 (archive signs with it)
#   DIST_CERT_P12       Apple Distribution identity as .p12, base64 (export re-signs with it)
#   CERT_PASSWORD       the password both .p12 files share
#
# Xcode creates the provisioning profiles itself through the API key
# (-allowProvisioningUpdates); only the certificates travel as secrets.

name: TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Core package tests
        run: swift test --package-path Packages/TouchTipsCore

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate the project
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          printf 'DEVELOPMENT_TEAM = %s\n' "$APPLE_TEAM_ID" > configs/Local.xcconfig
          xcodegen generate

      - name: Import signing identities
        env:
          DEV_CERT_P12: ${{ secrets.DEV_CERT_P12 }}
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/ci.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "$DEV_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dev.p12"
          echo "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          for p12 in dev dist; do
            security import "$RUNNER_TEMP/$p12.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP"/dev.p12 "$RUNNER_TEMP"/dist.p12
          security find-identity -v -p codesigning "$keychain"

      - name: Write the App Store Connect key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: echo "$ASC_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project TouchTips.xcodeproj \
            -scheme TouchTips \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TouchTips.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -quiet

      - name: Upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TouchTips.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove keys and keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/ci.keychain-db" 2>/dev/null || true
