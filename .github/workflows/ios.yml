name: iOS

on:
  pull_request:
    paths: ["Sources/**", "Packages/**", "Tests/**", "project.yml", "configs/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["Sources/**", "Packages/**", "Tests/**", "project.yml", "configs/**", ".github/workflows/ios.yml"]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - run: brew install xcodegen
      - name: Core package tests
        run: swift test --package-path Packages/TouchTipsCore
      - name: Simulator build, warnings are failures
        run: |
          cp configs/Local.example.xcconfig configs/Local.xcconfig
          xcodegen generate
          set -o pipefail
          xcodebuild -project TouchTips.xcodeproj -scheme TouchTips \
            -destination 'generic/platform=iOS Simulator' -quiet build CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
          if grep -q "warning:" build.log; then grep "warning:" build.log; echo "warnings are failures" >&2; exit 1; fi
      - name: Simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl privacy "$udid" grant contacts sh.harivan.touchtips
          xcrun simctl privacy "$udid" grant location sh.harivan.touchtips
          # Mint Plaza, San Francisco: cafés within a few metres, for the location screens.
          xcrun simctl location "$udid" set 37.78245,-122.40755
      - name: App unit tests
        run: |
          set -o pipefail
          xcodebuild -project TouchTips.xcodeproj -scheme TouchTips -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/dd -only-testing:TouchTipsTests -parallel-testing-enabled NO -quiet \
            test CODE_SIGNING_ALLOWED=NO 2>&1 | tail -80
      - name: Location and onboarding UI tests
        run: |
          set -o pipefail
          xcodebuild -project TouchTips.xcodeproj -scheme TouchTips -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/dd -resultBundlePath build/ui.xcresult -parallel-testing-enabled NO -quiet \
            -only-testing:TouchTipsUITests/LocationUITests \
            -only-testing:TouchTipsUITests/RegularUseUITests/testOnboardingContentReachable \
            test CODE_SIGNING_ALLOWED=NO 2>&1 | tail -80
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p screenshots
          [ -d build/ui.xcresult ] && xcrun xcresulttool export attachments --path build/ui.xcresult --output-path screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
